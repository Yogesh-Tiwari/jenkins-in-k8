apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-role-binding
  namespace: jenkins       # The namespace where Jenkins runs
subjects:
  - kind: ServiceAccount
    name: jenkins-svc-account          # Name of the ServiceAccount used by Jenkins
    namespace: jenkins     # Namespace of the ServiceAccount
roleRef:
  kind: Role
  name: jenkins-svc-user-role     # The role we created above
  apiGroup: rbac.authorization.k8s.io
